name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      # Ein scheiterndes Ziel darf die uebrigen nicht abwuergen - sonst bleibt
      # unbekannt, ob die anderen Plattformen gebaut haetten.
      fail-fast: false
      matrix:
        # macos-latest ist Apple Silicon (arm64). macos-15-intel liefert den
        # x86_64-Build fuer aeltere Intel-Macs - ohne ihn scheitert der Start
        # dort mit "bad CPU type in executable". Das Label ist laut GitHub bis
        # August 2027 verfuegbar, danach gibt es bei Actions kein x86_64 mehr.
        os: [windows-latest, ubuntu-22.04, macos-latest, macos-15-intel]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      # Nuitka braucht patchelf fuer den --standalone-Build unter Linux
      - name: Install patchelf (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y patchelf

      # bootstrap (venv + Deps + Nuitka) + compile (Nuitka-Build)
      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./bootstrap.ps1
          ./compile-win64.ps1

      - name: Build (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          ./bootstrap.sh
          ./compile-linux.sh

      - name: Build (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          ./bootstrap.sh
          ./compile-macos.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          retention-days: 1
          name: dist-${{ matrix.os }}
          path: |
            dist/jira-timesheet-v*.zip
            dist/jira-timesheet-v*.tar.gz

  release:
    needs: build
    # Auch veroeffentlichen, wenn einzelne Plattformen scheitern - die
    # erfolgreichen Artefakte sollen die Anwender trotzdem erreichen.
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            *.zip
            *.tar.gz
