name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Von Hand ausloesbar. Am 06.08.2026 hat GitHub zu einem Push gar keinen
  # CI-Lauf gestartet (der Pages-Job desselben Commits meldete "The job was
  # not acquired by Runner of type hosted"). Ohne diesen Eintrag bleibt als
  # Ausweg nur ein Leer-Commit.
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      # Ohne das cancelt ein Fehler auf einem OS die uebrigen Jobs, und deren
      # Ergebnis bleibt unbekannt.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}

      # uv sync loest ALLE Abhaengigkeiten aus uv.lock auf, inklusive der
      # oeffentlichen Git-Libs textual-themes und textual-widgets. Die frueher
      # hier gepflegte pip-Liste hat die beiden ausgelassen, weshalb jeder Test,
      # der ein textual-widgets-Widget importiert, beim Sammeln abbrach.
      - name: Sync dependencies (uv)
        run: uv sync --extra dev

      - name: Lint (ruff)
        run: uv run poe lint

      # War bis zum 08.09.2026 nicht in der CI: mypy lief nur lokal ueber
      # "poe typecheck". Ein Typfehler konnte damit auf main landen, obwohl
      # die Pruefung streng eingestellt ist und durchlaeuft.
      - name: Typen (mypy)
        run: uv run poe typecheck

      # Haelt die Schichtgrenzen fest: der Kern zieht keine Oberflaeche und
      # kein Textual. Ohne die Pruefung ist das eine Konvention.
      - name: Schichten (import-linter)
        run: uv run poe layers

      - name: Tests (pytest)
        run: uv run poe test
